default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "salary_dev") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "salary_test") %>

production:
  # Use DATABASE_URL for cloud deployments (Render, Heroku, etc.)
  # Rails will use DATABASE_URL if set, otherwise fall back to individual env vars
  url: <%= ENV["DATABASE_URL"] %>
